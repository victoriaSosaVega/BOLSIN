<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CU28 · Recepción de bolsín</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17211d;background:#f3f6f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.app{max-width:1080px;margin:0 auto;padding:28px 22px 52px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:14px;font-weight:750;letter-spacing:.04em;color:#176b53}.tag{font-size:12px;color:#557267;background:#e3eee9;padding:7px 11px;border-radius:99px}.hero{background:#123c31;color:#fff;padding:27px 30px;border-radius:18px;margin-bottom:20px}.hero small{color:#b4d7c9;font-weight:650;text-transform:uppercase;letter-spacing:.1em}.hero h1{font-size:27px;margin:8px 0}.hero p{margin:0;color:#d5e7df}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px}.steps,.card{background:white;border:1px solid #e1e9e4;border-radius:16px;box-shadow:0 5px 18px #183c3010}.steps{padding:18px;height:max-content}.steps h3{font-size:13px;margin:0 0 13px;color:#52665c}.step{font-size:13px;color:#839087;padding:10px 8px;border-left:2px solid #e2e9e4}.step.active{color:#176b53;border-color:#2f9977;font-weight:700}.card{padding:27px;min-height:390px}.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#47806a}.card h2{font-size:22px;margin:7px 0 8px}.muted{color:#65736b;line-height:1.55}.info{padding:15px 17px;background:#f2f7f4;border-radius:12px;margin:20px 0}.info b{display:block;font-size:12px;color:#6a7e73;margin-bottom:5px}.bolsin-list{display:grid;gap:10px;margin:18px 0}.bolsin,.doc,.radio{border:1px solid #e1e8e3;border-radius:12px;padding:15px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}.bolsin:hover,.doc:hover,.radio:hover{border-color:#64aa8e}.bolsin input,.doc input,.radio input{accent-color:#19815f;margin-top:3px}.bolsin strong{display:block}.meta{font-size:13px;color:#758178;margin-top:4px}.option-list{display:grid;gap:10px;margin:20px 0}.radio{align-items:center}.radio input{flex:0 0 auto}.radio div{font-size:14px}.docs{display:grid;gap:9px;margin:18px 0}.doc{padding:12px 14px;font-size:14px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:17px;border-top:1px solid #edf0ed}.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:700;cursor:pointer}.primary{background:#197657;color:#fff}.primary:hover{background:#12654a}.secondary{background:#edf3ef;color:#52645b}.danger{background:transparent;color:#9b514b}.notice{border-radius:12px;background:#eaf5ef;padding:14px 16px;color:#286146;margin:18px 0}.hidden{display:none!important}.empty{text-align:center;padding:60px 20px}.progress{height:5px;background:#e2ebe5;border-radius:4px;overflow:hidden;margin-top:18px}.progress span{display:block;height:100%;background:#71c1a0;transition:width .25s}@media(max-width:700px){.layout{grid-template-columns:1fr}.steps{display:none}.app{padding:16px}.hero{padding:22px}.card{padding:20px}}
</style></head>
<body><main class="app"><div class="top"><div class="brand">BOLSINES · SISTEMA DE GESTIÓN</div><div class="tag">Demostración interactiva</div></div><header class="hero"><small>Caso de uso 28</small><h1>Registrar recepción de bolsín</h1><p>Encargado de Bolsines · Centro de Mail Córdoba</p><div class="progress"><span id="progress" style="width:20%"></span></div></header><div class="layout"><aside class="steps"><h3>FLUJO DEL CASO</h3><div class="step active" data-n="1">1. Identificar destino</div><div class="step" data-n="2">2. Seleccionar bolsín</div><div class="step" data-n="3">3. Revisar recepción</div><div class="step" data-n="4">4. Confirmar cambios</div><div class="step" data-n="5">5. Resultado</div></aside><section class="card" id="screen"></section></div></main>
<script>
const screen=document.querySelector('#screen'), progress=document.querySelector('#progress');
let page=1,selected=0,currentBolsin=null;
const bolsines=[
  {id:'B-2048',origen:'CM Villa María',precinto:'PC-883104',remitos:['1001 · Solicitud de estudio médico','1002 · Dictamen preliminar'],estado:'Enviado'},
  {id:'B-2051',origen:'CM Río Cuarto',precinto:'PC-883129',remitos:['1003 · Historia clínica'],estado:'Enviado'},
  {id:'B-2057',origen:'CM San Francisco',precinto:'PC-883177',remitos:['1004 · Certificación laboral'],estado:'Enviado'}
];
function render(){
 document.querySelectorAll('.step').forEach(e=>e.classList.toggle('active',+e.dataset.n===page));
 progress.style.width=(page*20)+'%';
 if(page===1){screen.innerHTML=`<div class="eyebrow">Paso 1 de 5</div><h2>Centro de Mail de destino</h2><p class="muted">El sistema obtiene la CM asociada al empleado de la sesión.</p><div class="info"><b>EMPLEADO LOGUEADO</b>Mariana López · Encargada de Bolsines</div><div class="info"><b>CM DESTINO</b>Centro de Mail Córdoba</div><div class="actions"><span class="muted">Sesión activa</span><button class="btn primary" onclick="page=2;render()">Ver bolsines enviados →</button></div>`}
 else if(page===2){screen.innerHTML=`<div class="eyebrow">Paso 2 de 5</div><h2>Seleccioná un bolsín</h2><p class="muted">Se listan los bolsines Enviados a la CM del empleado.</p><div class="bolsin-list">${bolsines.filter(b=>b.estado==='Enviado').map((b,i)=>`<label class="bolsin"><input type="radio" name="bolsin" ${i===selected?'checked':''} onchange="selected=${i}"><span><strong>${b.id} <span class="tag">${b.estado}</span></strong><span class="meta">Origen: ${b.origen} · Precinto: ${b.precinto}</span></span></label>`).join('')}</div><div class="actions"><span class="muted">${bolsines.filter(b=>b.estado==='Enviado').length} bolsines encontrados</span><button class="btn primary" onclick="currentBolsin=bolsines.filter(b=>b.estado==='Enviado')[selected];page=3;render()">Seleccionar bolsín →</button></div>`}
 else if(page===3){const b=currentBolsin;screen.innerHTML=`<div class="eyebrow">Paso 3 de 5</div><h2>Revisá los remitos y la documentación</h2><p class="muted">Bolsín <b>${b.id}</b> · ${b.origen} · Precinto ${b.precinto}</p><div class="info"><b>REMITOS Y DOCUMENTACIÓN ASOCIADA</b>${b.remitos.map(x=>'• '+x).join('<br>')}</div><div class="notice">Para este recorrido del diagrama, el contenido coincide con lo registrado y pasa a <b>Recibido y Aceptado</b>.</div><div class="actions"><span class="muted">Opción representada en la secuencia</span><button class="btn primary" onclick="page=4;render()">Continuar →</button></div>`}
 else if(page===4){const b=currentBolsin;screen.innerHTML=`<div class="eyebrow">Paso 4 de 5</div><h2>Confirmar recepción</h2><p class="muted">Se registrará la recepción del bolsín ${b.id}.</p><div class="notice">Bolsín: <b>Recibido en CM Destino</b><br>Remitos: <b>Recibido y Aceptado</b><br>Documentación: <b>Recibida y Aceptada</b></div><div class="actions"><button class="btn secondary" onclick="page=3;render()">← Volver</button><button class="btn primary" onclick="confirmar()">Confirmar</button></div>`}
 else{screen.innerHTML=`<div class="empty"><div style="font-size:42px">✓</div><div class="eyebrow">Caso de uso completado</div><h2>Recepción registrada</h2><p class="muted">Se actualizaron los estados y se notificó a ${currentBolsin.origen}.</p><button class="btn primary" onclick="page=1;selected=0;currentBolsin=null;render()">Iniciar otra recepción</button></div>`}
}
function confirmar(){const b=currentBolsin;b.estado='Recibido en CM Destino';page=5;render()}
render();
</script></body></html>
